<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drone Arena</title>
<style>
  :root {
    --bg: #f5f4f0; --card: #ffffff; --fg: #15171a; --muted: #5d6470;
    --accent: #d99a00; --btn-fg: #111; --err: #b91c1c; --line: #d9d6cc;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0e11; --card: #16191e; --fg: #eceef1; --muted: #9aa2ad;
      --accent: #f5b82e; --btn-fg: #111; --err: #ef4444; --line: #2a2f37;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }

  header {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  #stats { flex: 1; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

  #stage {
    position: relative; flex: 1; min-height: 0; background: #000;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #view { display: block; width: auto; height: auto; max-width: 100%; max-height: 100%; }
  #video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #toast {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.72); color: #fff; padding: 8px 14px; border-radius: 10px;
    font-size: 16px; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  #panel {
    padding: 12px 12px calc(14px + env(safe-area-inset-bottom, 0px));
    background: var(--card); border-top: 1px solid var(--line);
  }
  #hint { font-size: 15px; line-height: 1.4; margin: 0 0 10px; color: var(--muted); min-height: 2.8em; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }

  button {
    flex: 1 1 30%; min-width: 96px; padding: 12px 10px; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; background: var(--accent); color: var(--btn-fg); cursor: pointer;
  }
  button.sec { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
  button.small { flex: none; min-width: 0; padding: 7px 10px; font-size: 13px; }
  button:disabled { opacity: .4; cursor: default; }

  .err {
    display: none; background: var(--err); color: #fff; padding: 10px 12px;
    border-radius: 10px; margin: 0 0 10px; font-size: 15px; line-height: 1.4;
  }
  .err.show { display: block; }

  #menu {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 14px; padding: 24px; background: var(--bg);
  }
  #menu h2 { font-size: 34px; margin: 0; letter-spacing: .5px; }
  #menu p { color: var(--muted); text-align: center; margin: 0; max-width: 320px; line-height: 1.45; }
  #menu .err { width: 100%; max-width: 320px; }
  #menu button { width: 100%; max-width: 320px; flex: none; font-size: 18px; padding: 16px; }
</style>
</head>
<body>

<div id="menu">
  <h2>Drone Arena</h2>
  <p>Пролетите через ворота и не задевайте препятствия за 120 секунд.</p>
  <p>Если разметка уже сохранена, она загрузится автоматически.</p>
  <div id="menuError" class="err"></div>
  <button id="btnCam">Камера</button>
  <button id="btnFile" class="sec">Видео из файла</button>
  <input type="file" id="fileInput" accept="video/*" style="display:none">
</div>

<header>
  <h1>Drone Arena</h1>
  <div id="stats"></div>
  <button id="dbgBtn" class="sec small">Отладка</button>
  <button id="soundBtn" class="sec small">Звук: вкл</button>
  <button id="menuBtn" class="sec small">Меню</button>
</header>

<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="view" width="640" height="480"></canvas>
  <div id="toast"></div>
</div>

<div id="panel">
  <div id="error" class="err"></div>
  <p id="hint"></p>
  <div id="btns" class="row"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const video = $('video');
const view = $('view');
const vctx = view.getContext('2d');

// Маленькая копия кадра для быстрой обработки
const SW = 320, SH = 240;
const small = document.createElement('canvas');
small.width = SW; small.height = SH;
const sctx = small.getContext('2d', { willReadFrequently: true });

const STORE_KEY = 'droneArena_v1';
const GAME_SECONDS = 120;
const OBST_COLORS = ['#ff5a6a', '#ff9f1c', '#3b82f6', '#a855f7', '#f472b6', '#22d3ee'];
const HUE_TOL = 18;     // допуск по оттенку цвета дрона, в градусах
const SAT_MIN = 0.25;   // минимальная насыщенность пикселя, чтобы считаться цветным
const VAL_TOL = 0.3;    // допуск по яркости
const DEBUG = false;   // true — показать найденные пятна (для настройки)
const DIFF = 28;       // насколько должна измениться яркость пикселя (0–255)
const MIN_BLOB = 3;    // минимальный размер пятна в пикселях, меньше — шум
const MAX_BLOB_FRAC = 0.06; // пятно больше 6% зоны — это свет или человек, а не дрон
const TRACK_GATE = 0.10;    // насколько далеко дрон может сместиться за кадр (доля кадра)
const CONFIRM = 2;          // сколько раз подряд пятно должно появиться, чтобы стать дроном
const HOLD_MS = 800;    // сколько держать последнюю позицию дрона, если он на время пропал
const GATE_COOLDOWN = 1500;
const OBST_COOLDOWN = 1500;
const OBST_R = 0.05;    // радиус препятствия в долях высоты кадра
// Оригинальная игровая тема (собственная мелодия, не из чужих песен)
const BASS = [110, 110, 130.8, 110, 146.8, 146.8, 123.5, 110, 98, 98, 110, 98, 130.8, 130.8, 123.5, 110];
const LEAD = [440, 0, 523.3, 659.3, 0, 587.3, 523.3, 0, 392, 0, 440, 523.3, 0, 493.9, 440, 0];

const state = {
  phase: 'menu',        // menu, zone, gates, obstacles, bg, ready, countdown, playing, over
  zone: [], gates: [], obstacles: [], pending: [],
  bg: null, mask: null, maskCount: 0,
  drone: null,          // текущая позиция дрона [x, y] в долях кадра
  prevDrone: null,      // позиция на предыдущей проверке
  lastSeen: 0,          // когда дрон последний раз был найден
  track: null,          // трекер дрона: позиция, скорость, время последней находки
  candidate: null,      // пятно, которое ещё подтверждается
  lastCands: [],        // все найденные пятна (для отладки)
  target: null,         // цвет дрона: {h, v} — оттенок и яркость, запомненные тапом
  debug: DEBUG,         // режим отладки (кнопка «Отладка»)
  fx: [], texts: [], trail: [], shake: 0, greenUntil: 0, redUntil: 0,
  score: 0, gatesPassed: 0, hits: 0, endTime: 0,
  soundOn: true, frameNo: 0, videoReady: false, countdownText: ''
};
let gateStates = [], obstStates = [];
let sampling = null;      // сбор кадров для запоминания фона
let stream = null, audioCtx = null, melodyTimer = null, toastTimer = null;

/* ---------- Сообщения и ошибки ---------- */

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

function showError(msg) {
  ['error', 'menuError'].forEach(id => {
    const el = $(id);
    el.textContent = msg;
    el.classList.add('show');
  });
}

function clearError() {
  ['error', 'menuError'].forEach(id => $(id).classList.remove('show'));
}

function camError(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError')
    return 'Нет доступа к камере. Разрешите камеру в настройках (на iPhone: Настройки → Safari → Камера) и обновите страницу.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError')
    return 'Камера не найдена на этом устройстве.';
  if (n === 'NotReadableError')
    return 'Камера занята другим приложением. Закройте его и попробуйте снова.';
  return 'Не удалось открыть камеру' + (e && e.message ? ': ' + e.message : '.');
}

/* ---------- Звук ---------- */

function getAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep(freq, dur, type = 'sine', vol = 0.15) {
  if (!state.soundOn) return;
  const ctx = getAudio();
  if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + dur);
}

function startMelody() {
  stopMelody();
  let i = 0;
  melodyTimer = setInterval(() => {
    const k = i++ % 16;
    beep(BASS[k], 0.22, 'triangle', 0.14);
    if (LEAD[k]) beep(LEAD[k], 0.18, 'square', 0.045);
  }, 210);
}

function stopMelody() {
  clearInterval(melodyTimer);
  melodyTimer = null;
}

function toggleSound() {
  state.soundOn = !state.soundOn;
  $('soundBtn').textContent = state.soundOn ? 'Звук: вкл' : 'Звук: выкл';
  if (state.soundOn) getAudio();
}

/* ---------- Сохранение разметки ---------- */

function saveCalib() {
  state.mask = null; // зона могла измениться — пересчитаем маску
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      zone: state.zone, gates: state.gates, obstacles: state.obstacles, target: state.target
    }));
  } catch (e) {
    showError('Не удалось сохранить разметку на телефоне. Игра работает, но при следующем запуске придётся размечать заново.');
  }
}

function loadCalib() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (d && Array.isArray(d.zone) && d.zone.length === 4) {
      state.zone = d.zone;
      state.gates = d.gates || [];
      state.obstacles = d.obstacles || [];
      state.target = d.target || null;
    }
  } catch (e) {
    // Сохранённые данные повреждены — начнём разметку заново
  }
}

/* ---------- Камера и видео ---------- */

async function startCamera() {
  clearError();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError('Этот браузер не даёт доступ к камере. Откройте страницу в Safari или Chrome по адресу https.');
    return false;
  }
  getAudio();
  const attempts = [
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24 } }, audio: false },
    { video: true, audio: false } // запасной вариант без настроек
  ];
  let err = null;
  for (const c of attempts) {
    try {
      stream = await navigator.mediaDevices.getUserMedia(c);
      break;
    } catch (e) {
      err = e;
    }
  }
  if (!stream) {
    showError(camError(err));
    return false;
  }
  video.srcObject = stream;
  try {
    await video.play();
  } catch (e) {
    stopAll();
    showError('Не удалось запустить видео с камеры. Нажмите кнопку ещё раз.');
    return false;
  }
  return true;
}

function stopAll() {
  stopMelody();
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.pause();
  video.srcObject = null;
  video.removeAttribute('src');
  video.load();
  state.videoReady = false;
  state.bg = null;
  state.drone = null;
  state.prevDrone = null;
  state.track = null;
  state.candidate = null;
  sampling = null;
}

video.addEventListener('loadedmetadata', () => {
  view.width = video.videoWidth || 640;
  view.height = video.videoHeight || 480;
  state.videoReady = true;
  renderPanel();
});

video.addEventListener('error', () => {
  if (video.currentSrc) showError('Не удалось воспроизвести видео. Попробуйте другой файл (лучше MP4).');
});

function afterSource() {
  $('menu').style.display = 'none';
  setPhase(state.zone.length === 4 ? 'bg' : 'zone');
}

/* ---------- Геометрия ---------- */

function inPoly(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

// Проверяем, пересёк ли путь дрона от a до b рамку ворот q (все точки в долях кадра)
function segHitPoly(a, b, q) {
  for (let s = 0; s <= 1.0001; s += 0.1) {
    const x = a[0] + (b[0] - a[0]) * s;
    const y = a[1] + (b[1] - a[1]) * s;
    if (inPoly(x, y, q)) return true;
  }
  return false;
}

// Расстояние от точки p до отрезка a–b, в пикселях кадра
function segDistPx(p, a, b, W, H) {
  const ax = a[0] * W, ay = a[1] * H, bx = b[0] * W, by = b[1] * H;
  const px = p[0] * W, py = p[1] * H;
  const dx = bx - ax, dy = by - ay;
  const L = dx * dx + dy * dy || 1;
  let t = ((px - ax) * dx + (py - ay) * dy) / L;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}

// Маска: какие пиксели маленькой копии кадра лежат внутри жёлтой зоны
function buildMask() {
  const m = new Uint8Array(SW * SH);
  let c = 0;
  if (state.zone.length === 4) {
    for (let y = 0; y < SH; y++) {
      for (let x = 0; x < SW; x++) {
        if (inPoly((x + 0.5) / SW, (y + 0.5) / SH, state.zone)) { m[y * SW + x] = 1; c++; }
      }
    }
  }
  state.mask = m;
  state.maskCount = c;
}

/* ---------- Обработка кадров ---------- */

function grabGray() {
  sctx.drawImage(video, 0, 0, SW, SH);
  const d = sctx.getImageData(0, 0, SW, SH).data;
  const g = new Float32Array(SW * SH);
  for (let i = 0, j = 0; j < g.length; i += 4, j++) {
    g[j] = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
  }
  return g;
}

function startBgCapture() {
  if (!state.videoReady) {
    showError('Камера ещё не готова. Подождите секунду.');
    return;
  }
  clearError();
  sampling = { sum: null, count: 0, endAt: Date.now() + 2000 };
  renderPanel();
}

function finishSampling() {
  const n = sampling.count, sum = sampling.sum;
  sampling = null;
  if (n < 5 || !sum) {
    showError('Камера передаёт слишком мало кадров. Подождите пару секунд и попробуйте снова.');
    renderPanel();
    return;
  }
  const bg = new Float32Array(SW * SH);
  for (let i = 0; i < bg.length; i++) bg[i] = sum[i] / n;
  state.bg = bg;
  state.mask = null;
  clearError();
  setPhase('sample');
  toast('Поле запомнено');
}

// Находит все связанные группы изменившихся пикселей (пятна)
function blobs(changed) {
  const seen = new Uint8Array(SW * SH), out = [], stack = new Int32Array(SW * SH);
  for (let i = 0; i < changed.length; i++) {
    if (!changed[i] || seen[i]) continue;
    let sp = 0, area = 0, sx = 0, sy = 0;
    let minx = SW, maxx = 0, miny = SH, maxy = 0;
    stack[sp++] = i; seen[i] = 1;
    while (sp) {
      const k = stack[--sp], x = k % SW, y = (k / SW) | 0;
      area++; sx += x; sy += y;
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y;
      if (x > 0)      { const n = k - 1;  if (changed[n] && !seen[n]) { seen[n] = 1; stack[sp++] = n; } }
      if (x < SW - 1) { const n = k + 1;  if (changed[n] && !seen[n]) { seen[n] = 1; stack[sp++] = n; } }
      if (y > 0)      { const n = k - SW; if (changed[n] && !seen[n]) { seen[n] = 1; stack[sp++] = n; } }
      if (y < SH - 1) { const n = k + SW; if (changed[n] && !seen[n]) { seen[n] = 1; stack[sp++] = n; } }
    }
    out.push({ x: sx / area, y: sy / area, area, w: maxx - minx + 1, h: maxy - miny + 1 });
  }
  return out;
}

// RGB (0–255) -> HSV: оттенок в градусах, насыщенность и яркость от 0 до 1
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return [h, mx ? d / mx : 0, mx];
}

// Цветной кадр (RGBA) маленькой копии
function grabRGB() {
  sctx.drawImage(video, 0, 0, SW, SH);
  return sctx.getImageData(0, 0, SW, SH).data;
}

// Ищем пятна внутри зоны: по цвету дрона, а если он не запомнен — по отличию от фона
function detect(d) {
  const s = state, m = s.mask, bg = s.bg, n = SW * SH, t = s.target;
  const changed = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    if (!m[i]) continue;
    const r = d[4 * i], g = d[4 * i + 1], b = d[4 * i + 2];
    if (t) {
      const [h, sat, v] = rgb2hsv(r, g, b);
      let dh = Math.abs(h - t.h);
      dh = Math.min(dh, 360 - dh);
      if (sat >= SAT_MIN && dh <= HUE_TOL && Math.abs(v - t.v) <= VAL_TOL) changed[i] = 1;
    } else {
      const gray = r * 0.299 + g * 0.587 + b * 0.114;
      if (Math.abs(gray - bg[i]) > DIFF) changed[i] = 1;
    }
  }
  // Фон подстраивается только в режиме без цвета и только там, где ничего не изменилось
  if (!t && (s.phase === 'playing' || s.phase === 'countdown')) {
    for (let i = 0; i < n; i++) {
      if (m[i] && !changed[i]) {
        const gray = d[4 * i] * 0.299 + d[4 * i + 1] * 0.587 + d[4 * i + 2] * 0.114;
        bg[i] += (gray - bg[i]) * 0.02;
      }
    }
  }
  const maxArea = s.maskCount * MAX_BLOB_FRAC;
  return blobs(changed).filter(b =>
    b.area >= MIN_BLOB && b.area <= maxArea &&
    Math.max(b.w, b.h) / Math.min(b.w, b.h) <= 4
  );
}

// Запоминаем цвет дрона из 5×5 пикселей вокруг места тапа
function sampleAt(p) {
  const d = grabRGB();
  const cx = Math.round(p[0] * (SW - 1)), cy = Math.round(p[1] * (SH - 1));
  let r = 0, g = 0, b = 0, c = 0;
  for (let dy = -2; dy <= 2; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      const x = cx + dx, y = cy + dy;
      if (x < 0 || y < 0 || x >= SW || y >= SH) continue;
      const k = (y * SW + x) * 4;
      r += d[k]; g += d[k + 1]; b += d[k + 2]; c++;
    }
  }
  const [h, sat, v] = rgb2hsv(r / c, g / c, b / c);
  if (sat < 0.15) {
    showError('Этот участок серый или белый. Тапните по цветной части дрона или выберите «Без цвета».');
    return false;
  }
  state.target = { h, v };
  clearError();
  return true;
}

// Трекер: ведёт дрон, предсказывая его движение, и подтверждает новые пятна
function trackStep(cands, now) {
  const s = state;
  const pts = cands.map(c => ({ x: c.x / SW, y: c.y / SH, area: c.area }));

  const near = (x, y) => {
    let best = null, bd = TRACK_GATE;
    for (const p of pts) {
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  };

  if (s.track) {
    const t = s.track;
    const px = t.x + t.vx, py = t.y + t.vy;   // предсказанная позиция
    const m = near(px, py);
    if (m) {
      const nx = 0.6 * m.x + 0.4 * px, ny = 0.6 * m.y + 0.4 * py;
      t.vx = 0.5 * t.vx + 0.5 * (nx - t.x);
      t.vy = 0.5 * t.vy + 0.5 * (ny - t.y);
      t.x = nx; t.y = ny;
      t.seen = now;
    } else {
      t.x = px; t.y = py;
      t.vx *= 0.9; t.vy *= 0.9;
      if (now - t.seen > HOLD_MS) s.track = null;
    }
    return;
  }

  // Дрона пока нет: ищем пятно, которое держится на одном месте
  if (s.candidate) {
    const c = s.candidate, m = near(c.x, c.y);
    if (m) {
      c.x = m.x; c.y = m.y; c.n++;
      if (c.n >= CONFIRM) {
        s.track = { x: c.x, y: c.y, vx: 0, vy: 0, seen: now };
        s.candidate = null;
        return;
      }
    } else {
      s.candidate = null;
    }
  }
  if (!s.candidate && pts.length) {
    const p = s.target
      ? pts.reduce((a, b) => (b.area > a.area ? b : a))
      : pts.reduce((a, b) => (b.area < a.area ? b : a));
    s.candidate = { x: p.x, y: p.y, n: 1 };
  }
}

/* ---------- Игровые события ---------- */

function addScore(n, msg) {
  state.score += n;
  toast(msg);
}

// Частицы, всплывающие надписи и вспышки
function burst(x, y, color, n) {
  const s = state;
  if (s.fx.length > 300) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 6;
    s.fx.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
                life: 1, color, size: 3 + Math.random() * 4 });
  }
}

function floatText(text, x, y, color) {
  state.texts.push({ text, x, y, color, t0: performance.now() });
}

function polyCenter(q) {
  let sx = 0, sy = 0;
  q.forEach(p => { sx += p[0]; sy += p[1]; });
  return [sx / q.length * view.width, sy / q.length * view.height];
}

// Очки начисляются сразу, когда путь дрона пересёк ворота или прошёл близко к препятствию
function checkGameEvents() {
  const s = state, cur = s.drone, prev = s.prevDrone || cur, now = Date.now();
  if (!cur) return;
  const W = view.width, H = view.height;

  s.gates.forEach((g, i) => {
    const gs = gateStates[i];
    if (now < gs.cool) return;
    if (segHitPoly(prev, cur, g)) {
      gs.cool = now + GATE_COOLDOWN;
      gs.flash = now + 500;
      s.gatesPassed++;
      s.score += 10;
      const [cx, cy] = polyCenter(g);
      burst(cx, cy, '#35e0a1', 45);
      burst(cur[0] * W, cur[1] * H, '#ffffff', 12);
      floatText('+10', cx, cy, '#35e0a1');
      s.greenUntil = now + 350;
      s.shake = 4;
      beep(880, 0.25);
      beep(1320, 0.3, 'sine', 0.12);
    }
  });

  s.obstacles.forEach((o, i) => {
    const os = obstStates[i];
    if (now < os.cool) return;
    if (segDistPx(o, prev, cur, W, H) < OBST_R * H) {
      os.cool = now + OBST_COOLDOWN;
      os.flash = now + 400;
      s.hits++;
      s.score -= 5;
      const x = o[0] * W, y = o[1] * H;
      const col = OBST_COLORS[i % OBST_COLORS.length];
      burst(x, y, col, 35);
      floatText('−5', x, y - 30, col);
      s.redUntil = now + 300;
      s.shake = 16;
      beep(220, 0.3, 'square', 0.2);
    }
  });
}

/* ---------- Отрисовка ---------- */

function drawOverlays() {
  const s = state, W = view.width, H = view.height;
  const px = p => [p[0] * W, p[1] * H];

  const poly = (pts, stroke, fill, close = true) => {
    if (pts.length < 2) return;
    vctx.beginPath();
    pts.forEach((p, i) => {
      const [x, y] = px(p);
      if (i === 0) vctx.moveTo(x, y); else vctx.lineTo(x, y);
    });
    if (close) vctx.closePath();
    if (fill) { vctx.fillStyle = fill; vctx.fill(); }
    vctx.strokeStyle = stroke;
    vctx.lineWidth = Math.max(2, W / 200);
    vctx.stroke();
  };

  if (s.zone.length === 4) poly(s.zone, '#facc15', 'rgba(250,204,21,0.12)');
  s.gates.forEach(g => poly(g, '#22c55e', 'rgba(34,197,94,0.15)'));

  s.obstacles.forEach((o, i) => {
    const [x, y] = px(o);
    const col = OBST_COLORS[i % OBST_COLORS.length];
    vctx.beginPath();
    vctx.arc(x, y, OBST_R * H, 0, Math.PI * 2);
    vctx.fillStyle = col + '59';
    vctx.fill();
    vctx.strokeStyle = col;
    vctx.lineWidth = 3;
    vctx.stroke();
  });

  if (s.pending.length) {
    poly(s.pending, '#ffffff', null, false);
    s.pending.forEach(p => {
      const [x, y] = px(p);
      vctx.beginPath();
      vctx.arc(x, y, 6, 0, Math.PI * 2);
      vctx.fillStyle = '#ffffff';
      vctx.fill();
      vctx.strokeStyle = '#000';
      vctx.lineWidth = 2;
      vctx.stroke();
    });
  }

  if (s.debug) {
    vctx.strokeStyle = '#00e5ff'; vctx.lineWidth = 1;
    s.lastCands.forEach(c => vctx.strokeRect(c.x / SW * W - 5, c.y / SH * H - 5, 10, 10));
  }
  if (s.drone && (s.phase === 'playing' || s.phase === 'countdown')) {
    const [x, y] = px(s.drone);
    vctx.beginPath();
    vctx.arc(x, y, H * 0.04, 0, Math.PI * 2);
    vctx.strokeStyle = '#22c55e';
    vctx.lineWidth = 4;
    vctx.stroke();
  }

  if (s.countdownText) {
    const big = s.countdownText.length > 2 ? H * 0.2 : H * 0.35;
    vctx.font = `bold ${big}px sans-serif`;
    vctx.textAlign = 'center';
    vctx.textBaseline = 'middle';
    vctx.lineWidth = H * 0.02;
    vctx.strokeStyle = 'rgba(0,0,0,0.6)';
    vctx.fillStyle = '#ffffff';
    vctx.strokeText(s.countdownText, W / 2, H / 2);
    vctx.fillText(s.countdownText, W / 2, H / 2);
  }
}

// Все визуальные эффекты: след, свечение дрона, частицы, надписи, вспышки
function drawFx() {
  const s = state, W = view.width, H = view.height, now = performance.now();
  const inGame = s.phase === 'playing' || s.phase === 'countdown';

  if (now < s.greenUntil) { vctx.fillStyle = 'rgba(53,224,161,0.18)'; vctx.fillRect(0, 0, W, H); }
  if (now < s.redUntil)   { vctx.fillStyle = 'rgba(255,60,80,0.22)'; vctx.fillRect(0, 0, W, H); }

  // Яркая обводка ворот и препятствий в момент события
  s.gates.forEach((g, i) => {
    const f = gateStates[i] && gateStates[i].flash;
    if (!f || now > f) return;
    vctx.beginPath();
    g.forEach((p, k) => k ? vctx.lineTo(p[0] * W, p[1] * H) : vctx.moveTo(p[0] * W, p[1] * H));
    vctx.closePath();
    vctx.strokeStyle = '#ffffff'; vctx.lineWidth = 8; vctx.stroke();
  });
  s.obstacles.forEach((o, i) => {
    const f = obstStates[i] && obstStates[i].flash;
    if (!f || now > f) return;
    vctx.beginPath();
    vctx.arc(o[0] * W, o[1] * H, OBST_R * H * 1.4, 0, Math.PI * 2);
    vctx.strokeStyle = '#ffffff'; vctx.lineWidth = 6; vctx.stroke();
  });

  // След дрона
  if (inGame && s.trail.length > 1) {
    s.trail.forEach((p, i) => {
      const a = (i + 1) / s.trail.length;
      vctx.beginPath();
      vctx.arc(p[0] * W, p[1] * H, 3 + a * 6, 0, Math.PI * 2);
      vctx.fillStyle = 'rgba(53,224,161,' + (a * 0.5) + ')';
      vctx.fill();
    });
  }

  // Заметный дрон: пульсирующее кольцо и прицел
  if (inGame && s.drone) {
    const x = s.drone[0] * W, y = s.drone[1] * H;
    const r = H * 0.035 + Math.sin(now / 120) * 3;
    vctx.beginPath(); vctx.arc(x, y, r + 9, 0, Math.PI * 2);
    vctx.strokeStyle = 'rgba(53,224,161,0.35)'; vctx.lineWidth = 6; vctx.stroke();
    vctx.beginPath(); vctx.arc(x, y, r, 0, Math.PI * 2);
    vctx.strokeStyle = '#35e0a1'; vctx.lineWidth = 3; vctx.stroke();
    vctx.beginPath();
    vctx.moveTo(x - r - 16, y); vctx.lineTo(x - r + 3, y);
    vctx.moveTo(x + r - 3, y);  vctx.lineTo(x + r + 16, y);
    vctx.moveTo(x, y - r - 16); vctx.lineTo(x, y - r + 3);
    vctx.moveTo(x, y + r - 3);  vctx.lineTo(x, y + r + 16);
    vctx.stroke();
  }

  // Частицы
  s.fx = s.fx.filter(p => p.life > 0);
  s.fx.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= 0.025;
    vctx.globalAlpha = Math.max(0, p.life);
    vctx.fillStyle = p.color;
    vctx.beginPath();
    vctx.arc(p.x, p.y, p.size * p.life + 1, 0, Math.PI * 2);
    vctx.fill();
  });
  vctx.globalAlpha = 1;

  // Всплывающие надписи +10 и −5
  s.texts = s.texts.filter(t => now - t.t0 < 1200);
  s.texts.forEach(t => {
    const a = (now - t.t0) / 1200;
    vctx.globalAlpha = 1 - a;
    vctx.font = 'bold ' + (H * 0.09) + 'px system-ui';
    vctx.textAlign = 'center';
    vctx.lineWidth = H * 0.012;
    vctx.strokeStyle = 'rgba(0,0,0,0.6)';
    vctx.strokeText(t.text, t.x, t.y - a * 80);
    vctx.fillStyle = t.color;
    vctx.fillText(t.text, t.x, t.y - a * 80);
  });
  vctx.globalAlpha = 1;
  vctx.textAlign = 'left';
}

function updateStats() {
  const s = state, el = $('stats');
  if (s.phase === 'playing') {
    const left = Math.max(0, Math.ceil((s.endTime - Date.now()) / 1000));
    el.textContent = `Очки: ${s.score}   Время: ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}   Дрон: ${s.drone ? 'есть' : 'нет'}`;
  } else if (s.phase === 'over') {
    el.textContent = `Очки: ${s.score}`;
  } else {
    el.textContent = '';
  }
}

function loop() {
  requestAnimationFrame(loop);
  const s = state;

  if (s.phase === 'playing' && Date.now() >= s.endTime) endGame(true);
  updateStats();

  if (!s.videoReady || video.readyState < 2) return;
  const sk = s.shake;
  s.shake *= 0.85;
  const ox = sk > 0.5 ? (Math.random() - 0.5) * sk * 2 : 0;
  const oy = sk > 0.5 ? (Math.random() - 0.5) * sk * 2 : 0;
  vctx.drawImage(video, ox, oy, view.width, view.height);
  s.frameNo++;

  if (sampling && s.phase === 'bg') {
    const g = grabGray();
    if (!sampling.sum) sampling.sum = new Float32Array(SW * SH);
    for (let i = 0; i < g.length; i++) sampling.sum[i] += g[i];
    sampling.count++;
    if (Date.now() >= sampling.endAt) finishSampling();
  }

  // Обнаружение не на каждом кадре, а через один — так телефон не тормозит
  if ((s.phase === 'countdown' || s.phase === 'playing' || s.phase === 'sample') && s.bg && s.frameNo % 2 === 0) {
    if (!s.mask) buildMask();
    s.prevDrone = s.drone;
    s.lastCands = detect(grabRGB());
    trackStep(s.lastCands, Date.now());
    s.drone = s.track ? [s.track.x, s.track.y] : null;
    if (s.drone) {
      s.trail.push(s.drone.slice());
      if (s.trail.length > 14) s.trail.shift();
    }
    if (s.phase === 'playing') checkGameEvents();
  }

  drawOverlays();
  drawFx();
}

/* ---------- Фазы и панель управления ---------- */

function setPhase(p) {
  state.phase = p;
  state.pending = [];
  state.countdownText = '';
  sampling = null;
  renderPanel();
}

function renderPanel() {
  const s = state, panel = $('panel'), hint = $('hint'), btns = $('btns');
  if (s.phase === 'menu') {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = 'block';

  const B = (act, label, cls = '', dis = false) =>
    `<button data-act="${act}" class="${cls}" ${dis ? 'disabled' : ''}>${label}</button>`;
  const camWait = s.videoReady ? '' : ' Ждём изображение с камеры…';
  let h = '', b = '';

  switch (s.phase) {
    case 'zone':
      h = `Нажмите 4 точки по углам зоны полёта, по кругу. Появится жёлтый контур. Точек: ${s.pending.length}/4.`;
      b = B('undo', 'Отмена', 'sec') + B('reset', 'Сброс', 'sec') +
          B('next', 'Далее', '', !(s.zone.length === 4 && s.pending.length === 0));
      break;
    case 'gates':
      h = `Каждые 4 точки дают одну рамку ворот (зелёный контур). Готово ворот: ${s.gates.length}. Точек в текущей рамке: ${s.pending.length}/4.`;
      b = B('undo', 'Отмена', 'sec') + B('reset', 'Сброс', 'sec') +
          B('next', 'Далее', '', s.pending.length > 0);
      break;
    case 'obstacles':
      h = `Нажмите по одной точке на каждое препятствие (красный круг). Препятствий: ${s.obstacles.length}.`;
      b = B('undo', 'Отмена', 'sec') + B('reset', 'Сброс', 'sec') + B('next', 'Далее');
      break;
    case 'bg':
      h = sampling
        ? 'Запоминаем поле… Не двигайте телефон.'
        : 'Уберите людей и дрон из зоны полёта и нажмите «Запомнить поле». Это займёт около 2 секунд.' + camWait;
      b = B('bgCapture', 'Запомнить поле', '', !s.videoReady || !!sampling) +
          B('rezone', 'Перенастроить', 'sec') + B('menu', 'В меню', 'sec');
      break;
    case 'ready':
      h = 'Поле готово. Подготовьте дрон и нажмите СТАРТ. Будет обратный отсчёт 5-4-3-2-1.';
      b = B('start', 'СТАРТ') + B('toBg', 'Запомнить заново', 'sec') + B('toSample', 'Цвет дрона', 'sec') +
          B('rezone', 'Перенастроить', 'sec') + B('menu', 'В меню', 'sec');
      break;
    case 'sample':
      h = s.target
        ? 'Цвет дрона запомнен. Тапните по дрону ещё раз, чтобы выбрать заново, или нажмите «Дальше».'
        : 'Поставьте дрон в зону полёта и тапните по его цветной части. Программа запомнит цвет.';
      b = B('skipSample', 'Без цвета (по движению)', 'sec') + B('rezone', 'Перенастроить', 'sec') +
          (s.target ? B('toReady', 'Дальше') : '') + B('menu', 'В меню', 'sec');
      break;
    case 'countdown':
      h = 'Приготовьтесь!';
      b = B('cancelCount', 'Отмена', 'sec');
      break;
    case 'playing':
      h = 'Летите через зелёные ворота и не задевайте красные круги. Дрон ищется внутри жёлтой зоны.';
      b = B('stop', 'Остановить', 'sec');
      break;
    case 'over':
      h = `Игра окончена! Очки: ${s.score}. Ворот пройдено: ${s.gatesPassed}. Препятствий задето: ${s.hits}.`;
      b = B('again', 'Заново') + B('menu', 'В меню', 'sec');
      break;
  }
  hint.textContent = h;
  btns.innerHTML = b;
}

function undo() {
  const s = state;
  if (s.pending.length) s.pending.pop();
  else if (s.phase === 'zone') s.zone = [];
  else if (s.phase === 'gates') s.gates.pop();
  else if (s.phase === 'obstacles') s.obstacles.pop();
  saveCalib();
  renderPanel();
}

function nextStep() {
  const s = state;
  if (s.phase === 'zone') {
    if (s.zone.length !== 4 || s.pending.length) return;
    setPhase('gates');
  } else if (s.phase === 'gates') {
    if (s.pending.length) return;
    setPhase('obstacles');
  } else if (s.phase === 'obstacles') {
    setPhase('bg');
  }
}

/* ---------- Игра ---------- */

function runCountdown() {
  if (!state.bg) {
    showError('Сначала запомните поле: нажмите «Запомнить поле».');
    return;
  }
  setPhase('countdown');
  let n = 5;
  const tick = () => {
    if (state.phase !== 'countdown') return;
    if (n > 0) {
      state.countdownText = String(n);
      beep(660, 0.15);
      n--;
      setTimeout(tick, 1000);
    } else {
      state.countdownText = 'СТАРТ!';
      beep(990, 0.4);
      setTimeout(() => { if (state.phase === 'countdown') beginGame(); }, 600);
    }
  };
  tick();
}

function beginGame() {
  const s = state;
  s.score = 0; s.gatesPassed = 0; s.hits = 0;
  s.drone = null; s.prevDrone = null; s.lastSeen = 0;
  s.track = null; s.candidate = null;
  s.fx = []; s.texts = []; s.trail = []; s.shake = 0; s.greenUntil = 0; s.redUntil = 0;
  gateStates = s.gates.map(() => ({ cool: 0, flash: 0 }));
  obstStates = s.obstacles.map(() => ({ cool: 0, flash: 0 }));
  s.endTime = Date.now() + GAME_SECONDS * 1000;
  if (!s.mask) buildMask();
  setPhase('playing');
  startMelody();
}

function endGame(byTime) {
  if (state.phase !== 'playing') return;
  stopMelody();
  state.drone = null;
  state.prevDrone = null;
  state.track = null;
  state.candidate = null;
  beep(523, 0.4, 'sine', 0.2);
  setTimeout(() => beep(392, 0.6, 'sine', 0.2), 300);
  setPhase('over');
  toast(byTime ? 'Время вышло!' : 'Игра остановлена');
}

/* ---------- Меню и переходы ---------- */

function goMenu() {
  stopAll();
  state.phase = 'menu';
  $('menu').style.display = 'flex';
  renderPanel();
}

$('btnCam').onclick = async () => {
  if (await startCamera()) afterSource();
};

$('btnFile').onclick = () => {
  clearError();
  getAudio();
  $('fileInput').click();
};

$('fileInput').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  clearError();
  stopAll();
  video.src = URL.createObjectURL(f);
  video.loop = true;
  video.muted = true;
  video.play().catch(() => showError('Не удалось воспроизвести видеофайл. Попробуйте другой файл.'));
  afterSource();
};

$('dbgBtn').onclick = () => {
  state.debug = !state.debug;
  $('dbgBtn').textContent = state.debug ? 'Отладка: вкл' : 'Отладка';
};
$('soundBtn').onclick = toggleSound;
$('menuBtn').onclick = goMenu;

$('btns').addEventListener('click', e => {
  const act = e.target.dataset.act;
  if (!act || e.target.disabled) return;
  switch (act) {
    case 'undo': undo(); break;
    case 'reset':
      state.zone = []; state.gates = []; state.obstacles = []; state.target = null;
      saveCalib();
      setPhase('zone');
      break;
    case 'next': nextStep(); break;
    case 'rezone': setPhase('zone'); break;
    case 'toBg': setPhase('bg'); break;
    case 'toSample': setPhase('sample'); break;
    case 'toReady': setPhase('ready'); break;
    case 'skipSample': state.target = null; saveCalib(); setPhase('ready'); break;
    case 'bgCapture': startBgCapture(); break;
    case 'start':
    case 'again': runCountdown(); break;
    case 'cancelCount': setPhase('ready'); break;
    case 'stop': endGame(false); break;
    case 'menu': goMenu(); break;
  }
});

// Нажатия по видео — это разметка поля
view.addEventListener('click', e => {
  const s = state;
  if (!s.videoReady) return;
  const r = view.getBoundingClientRect();
  const p = [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
  if (p[0] < 0 || p[0] > 1 || p[1] < 0 || p[1] > 1) return;

  if (s.phase === 'zone') {
    s.pending.push(p);
    if (s.pending.length === 4) {
      s.zone = s.pending;
      s.pending = [];
      saveCalib();
      toast('Зона полёта запомнена');
    }
  } else if (s.phase === 'gates') {
    s.pending.push(p);
    if (s.pending.length === 4) {
      s.gates.push(s.pending);
      s.pending = [];
      saveCalib();
      toast('Ворота добавлены');
    }
  } else if (s.phase === 'obstacles') {
    s.obstacles.push(p);
    saveCalib();
  } else if (s.phase === 'sample') {
    if (sampleAt(p)) {
      saveCalib();
      toast('Цвет дрона запомнен');
      setPhase('ready');
    }
    return;
  } else {
    return;
  }
  renderPanel();
});

/* ---------- Запуск ---------- */

loadCalib();
renderPanel();
requestAnimationFrame(loop);
</script>
</body>
</html>
